[package]
categories   = ["gui"]
description  = "Ely's git components for GPUI: diffs, merges, history and the working tree."
edition      = "2024"
homepage     = "https://elygpui.com"
keywords     = ["gpui", "ui", "components", "widgets", "gui"]
license      = "MIT"
name         = "ely-git"
repository   = "https://github.com/ELY-Open-Source/Ely-GPUI-Components"
rust-version = "1.98"
version      = "0.2.0"

[package.metadata.upstream]
patch    = "Diff viewer family, pixel size, base weight and line-height builders shape and cache the same fonts they paint; configured line-height defines equal fixed row slots with inset focus borders and full-height backgrounds; Unified uses one two-axis viewport, Split uses two real viewports with bidirectionally linked axes, independently clamped horizontal ranges and per-pane scrollbar chrome, including live typography changes."
revision = "01a2135e99bb52fb817b7b62198dbdd24022bcf8"

[features]
test-support = ["ely-core/test-support", "gpui/test-support", "gpui/leak-detection"]

[dependencies]
ely-core   = { git = "https://github.com/ELY-Open-Source/Ely-GPUI-Components.git", rev = "01a2135e99bb52fb817b7b62198dbdd24022bcf8", default-features = false }
ely-editor = { git = "https://github.com/ELY-Open-Source/Ely-GPUI-Components.git", rev = "01a2135e99bb52fb817b7b62198dbdd24022bcf8" }
gpui       = { package = "gpui-pre", version = "=0.3.11", default-features = false }
log        = "0.4"
similar    = { version = "3.2", default-features = false, features = ["std", "text", "inline", "unicode"] }

# The native text system and Ely's own fonts, for the commit footer's Linux test.
[target.'cfg(target_os = "linux")'.dev-dependencies]
ely-core      = { git = "https://github.com/ELY-Open-Source/Ely-GPUI-Components.git", rev = "01a2135e99bb52fb817b7b62198dbdd24022bcf8", default-features = false, features = ["fonts"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["font-kit", "wayland", "x11"] }

[target.'cfg(target_family = "wasm")'.dependencies]
similar = { version = "3.2", default-features = false, features = ["wasm32_web_time"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
unreachable_pub = "warn"

[lints.clippy]
all                        = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
